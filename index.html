<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NJ Technopharma LLP - ERP System</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0d6efd;
      --sidebar: #1e293b;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: #334155; display: flex; min-height: 100vh; }

    /* LOGIN BOX */
    .auth-container {
      width: 90%; max-width: 400px; margin: auto; background: #fff;
      padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .auth-container h2 { text-align: center; margin-bottom: 25px; color: #0f172a; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    .btn {
      width: 100%; padding: 11px; background: var(--primary); color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; margin-top: 10px;
    }
    .btn:hover { opacity: 0.9; }
    .alert { padding: 10px; font-size: 13px; border-radius: 6px; margin-bottom: 15px; text-align: center; display: none; }
    .alert-error { background: #ffebee; color: #c62828; }

    /* DASHBOARD */
    .app-container { display: none; width: 100%; flex-direction: row; }
    .sidebar { width: 250px; background: var(--sidebar); color: #fff; min-height: 100vh; padding: 20px 0; }
    .sidebar h2 { text-align: center; font-size: 18px; margin-bottom: 30px; color: #38bdf8; }
    .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 12px; color: #94a3b8; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: #334155; color: #fff; border-left: 4px solid var(--primary); }

    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #fff; padding: 15px 25px; border-radius: 8px; border: 1px solid var(--border); }
    .page-section { display: none; }
    .page-section.active { display: block; }
    
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-top: 15px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f1f5f9; font-weight: 600; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="authSection" class="auth-container">
    <h2>NJ Technopharma ERP</h2>
    
    <div id="alertBox" class="alert alert-error"></div>

    <div class="form-group">
      <label>User Name</label>
      <input type="text" id="username" placeholder="Enter Username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter Password" required>
    </div>

    <button class="btn" onclick="handleLogin()">Login</button>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appSection" class="app-container">
    <div class="sidebar">
      <h2>NJ TECHNOPHARMA</h2>
      <div class="nav-item active" onclick="showPage('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Dashboard</div>
      <div class="nav-item" onclick="showPage('invoices', this)"><i class="fa-solid fa-file-invoice"></i> Billing / Invoices</div>
      <div class="nav-item" onclick="showPage('inventory', this)"><i class="fa-solid fa-boxes-stacked"></i> Inventory</div>
      <div class="nav-item" onclick="handleLogout()" style="margin-top: 50px; color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
    </div>

    <div class="main-content">
      <div class="header">
        <h2 id="pageTitle">Dashboard</h2>
        <div>Logged in as: <strong id="userDisplay"></strong></div>
      </div>

      <div id="dashboard" class="page-section active">
        <h3>Welcome to ERP Dashboard</h3>
        <p style="margin-top: 10px; color: #64748b;">System is active and operational.</p>
      </div>

      <div id="invoices" class="page-section">
        <h3>Invoice System</h3>
        <p style="margin-top: 10px;">Billing module area.</p>
      </div>

      <div id="inventory" class="page-section">
        <h3>Inventory Stock</h3>
        <table>
          <thead>
            <tr><th>Product Name</th><th>Batch</th><th>Stock</th></tr>
          </thead>
          <tbody>
            <tr><td>Paracetamol 500mg</td><td>BATCH-01</td><td>500</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('alertBox');

      // Fixed Credentials Check
      if (user === "Admin" && pass === "admin") {
        alertBox.style.display = 'none';
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('appSection').style.display = 'flex';
        document.getElementById('userDisplay').innerText = user;
      } else {
        alertBox.innerText = 'Invalid User Name or Password!';
        alertBox.style.display = 'block';
      }
    }

    function handleLogout() {
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('appSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
    }

    function showPage(pageId, element) {
      document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      element.classList.add('active');
      document.getElementById('pageTitle').innerText = element.innerText.trim();
    }
  </script>

</body>
</html>
