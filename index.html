<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NJ Technopharma LLP - Full ERP System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0d6efd;
      --sidebar: #1e293b;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: #334155; display: flex; min-height: 100vh; }

    /* LOGIN CONTAINER */
    .auth-container {
      width: 90%; max-width: 400px; margin: auto; background: #fff;
      padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .auth-container h2 { text-align: center; margin-bottom: ights</td>
              <td>None (Full Administrator Access)</td>
            </tr>
            <tr>
              <td><span class="badge-role badge-billing">Billing Staff</span></td>
              <td>Invoices / Billing, Quotations, Payments Received, Customer Directory</td>
              <td>Cannot access Inventory Stock settings or User Management</td>
            </tr>
            <tr>
              <td><span class="badge-role badge-inventory">Inventory Manager</span></td>
              <td>Inventory Stock & Products, Purchase Orders, Vendors Directory</td>
              <td>Cannot access Billing/Invoices or User Management</td>
            </tr>
            <tr>
              <td><span class="badge-role badge-view">View Only</span></td>
              <td>Dashboard & Overview Read-Only</td>
              <td>Cannot add, edit, or print any transaction/document</td>
            </tr>
          </tbody>
        </table>

        <h4>Existing Users & Rights</h4>
        <table id="userTable">
          <thead><tr><th>User Name</th><th>Assigned Role</th><th>Access Rights Summary</th><th>Action</th></tr></thead>
          <tbody>
            <tr>
              <td>Admin</td>
              <td><span class="badge-role badge-admin">Admin</span></td>
              <td>Full Administrator Access</td>
              <td><span style="color:#64748b;">Primary Admin</span></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let totalPaymentsReceived = 25000;

    // Users database with credentials & assigned roles
    let userDatabase = {
      "Admin": { pass: "admin", role: "Admin" }
    };

    function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('alertBox');

      if (userDatabase[user] && userDatabase[user].pass === pass) {
        alertBox.style.display = 'none';
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('appSection').style.display = 'flex';
        
        const role = userDatabase[user].role;
        document.getElementById('userDisplay').innerText = user;
        document.getElementById('userRoleDisplay').innerText = role;

        applyUserRights(role);

      } else {
        alertBox.innerText = 'Invalid Username or Password!';
        alertBox.style.display = 'block';
      }
    }

    function applyUserRights(role) {
      const navs = ['dashboard', 'invoices', 'quotations', 'po', 'payments', 'inventory', 'parties', 'usermanagement'];
      navs.forEach(n => document.getElementById('nav-' + n).style.display = 'flex');

      if (role === 'Billing') {
        document.getElementById('nav-inventory').style.display = 'none';
        document.getElementById('nav-po').style.display = 'none';
        document.getElementById('nav-usermanagement').style.display = 'none';
      } else if (role === 'Inventory') {
        document.getElementById('nav-invoices').style.display = 'none';
        document.getElementById('nav-quotations').style.display = 'none';
        document.getElementById('nav-payments').style.display = 'none';
        document.getElementById('nav-usermanagement').style.display = 'none';
      } else if (role === 'ViewOnly') {
        document.getElementById('nav-usermanagement').style.display = 'none';
      }

      showPage('dashboard', document.getElementById('nav-dashboard'));
    }

    function handleLogout() {
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('appSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
    }

    function showPage(pageId, element) {
      document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      if (element) element.classList.add('active');
      document.getElementById('pageTitle').innerText = element ? element.innerText.trim() : 'Dashboard';
    }

    // Invoice Calculation with Tax / Bill of Supply Toggle
    function addInvRow() {
      const div = document.createElement('div');
      div.className = 'doc-row';
      div.innerHTML = `
        <input type="text" placeholder="Product Description" class="inv-item">
        <input type="number" placeholder="Qty" class="inv-qty" value="1" oninput="calcInvoice()">
        <input type="number" placeholder="Rate (₹)" class="inv-rate" value="0" oninput="calcInvoice()">
      `;
      document.getElementById('invRows').appendChild(div);
    }

    function calcInvoice() {
      let sub = 0;
      const qtys = document.querySelectorAll('.inv-qty');
      const rates = document.querySelectorAll('.inv-rate');
      qtys.forEach((q, i) => {
        sub += (parseFloat(q.value) || 0) * (parseFloat(rates[i].value) || 0);
      });

      const docType = document.getElementById('invDocType').value;
      let gst = 0;

      if (docType === 'Tax Invoice') {
        gst = sub * 0.18;
        document.getElementById('gstRow').style.display = 'block';
      } else {
        document.getElementById('gstRow').style.display = 'none';
      }

      document.getElementById('invSub').innerText = sub.toFixed(2);
      document.getElementById('invGst').innerText = gst.toFixed(2);
      document.getElementById('invGrand').innerText = (sub + gst).toFixed(2);
    }

    // Purchase Order Logic
    function addPO() {
      const vendor = document.getElementById('poVendor').value.trim();
      const num = document.getElementById('poNum').value.trim();
      const item = document.getElementById('poItem').value.trim();
      const qty = parseFloat(document.getElementById('poQty').value) || 0;
      const rate = parseFloat(document.getElementById('poRate').value) || 0;

      if (!vendor || !item) {
        alert('Please fill Vendor Name and Item details.');
        return;
      }

      const total = qty * rate;
      const tbody = document.querySelector('#poTable tbody');
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${num}</td>
        <td>${vendor}</td>
        <td>${item}</td>
        <td>${qty}</td>
        <td>₹${total.toFixed(2)}</td>
        <td><span style="background:#fef3c7; color:#92400e; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:12px;">Pending</span></td>
      `;

      document.getElementById('poVendor').value = '';
      document.getElementById('poItem').value = '';
      document.getElementById('poQty').value = '';
      document.getElementById('poRate').value = '';

      alert(`Purchase Order ${num} created successfully!`);
    }

    // Payment Entry Logic
    function recordPayment() {
      const cust = document.getElementById('payCustomer').value.trim();
      const inv = document.getElementById('payInvNum').value.trim();
      const amt = parseFloat(document.getElementById('payAmount').value) || 0;
      const mode = document.getElementById('payMode').value;
      const ref = document.getElementById('payRef').value.trim();
      const date = document.getElementById('payDate').value || new Date().toISOString().split('T')[0];

      if (!cust || amt <= 0) {
        alert('Please enter Customer Name and valid Amount.');
        return;
      }

      const tbody = document.querySelector('#payTable tbody');
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${date}</td>
        <td>${cust}</td>
        <td>${inv || '-'}</td>
        <td>${mode}</td>
        <td>${ref || '-'}</td>
        <td style="color:#10b981; font-weight:bold;">₹${amt.toFixed(2)}</td>
      `;

      totalPaymentsReceived += amt;
      document.getElementById('statPayments').innerText = `₹${totalPaymentsReceived.toFixed(2)}`;

      document.getElementById('payCustomer').value = '';
      document.getElementById('payInvNum').value = '';
      document.getElementById('payAmount').value = '';
      document.getElementById('payRef').value = '';

      alert(`Payment of ₹${amt} recorded successfully!`);
    }

    // Add Party Logic
    function addParty() {
      const type = document.getElementById('partyType').value;
      const company = document.getElementById('companyName').value.trim();
      const contact = document.getElementById('contactName').value.trim();
      const gst = document.getElementById('gstNo').value.trim();
      const phone = document.getElementById('partyPhone').value.trim();
      const address = document.getElementById('partyAddress').value.trim();

      if (!company) {
        alert('Please enter Company Name!');
        return;
      }

      const tbody = document.querySelector('#partiesTable tbody');
      const row = tbody.insertRow();
      const badgeColor = type === 'Customer' ? 'background:#e0f2fe; color:#0369a1;' : 'background:#fef3c7; color:#92400e;';

      row.innerHTML = `
        <td><span style="${badgeColor} padding:3px 8px; border-radius:12px; font-weight:bold; font-size:12px;">${type}</span></td>
        <td>${company}</td>
        <td>${contact || '-'}</td>
        <td>${gst || '-'}</td>
        <td>${phone || '-'}</td>
        <td>${address || '-'}</td>
        <td><button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="this.closest('tr').remove()">Delete</button></td>
      `;

      document.getElementById('companyName').value = '';
      document.getElementById('contactName').value = '';
      document.getElementById('gstNo').value = '';
      document.getElementById('partyPhone').value = '';
      document.getElementById('partyAddress').value = '';

      alert(`${type} details added successfully!`);
    }

    // Product Creation
    function addProduct() {
      const name = prompt("Enter Product Name:");
      const batch = prompt("Enter Batch Number:");
      const stock = prompt("Enter Initial Stock Quantity:");
      const price = prompt("Enter Unit Price (₹):");

      if (name && batch) {
        const tbody = document.querySelector('#inventoryTable tbody');
        const row = tbody.insertRow();
        row.innerHTML = `<td>${name}</td><td>${batch}</td><td>${stock || 0}</td><td>₹${price || 0}</td>`;
      }
    }

    // User Management (Unchanged)
    function createUser() {
      const u = document.getElementById('newUsername').value.trim();
      const p = document.getElementById('newPassword').value.trim();
      const r = document.getElementById('newRole').value;

      if (!u || !p) {
        alert("Please enter both User Name and Password!");
        return;
      }

      userDatabase[u] = { pass: p, role: r };

      let badgeClass = 'badge-admin';
      let summary = 'Full Administrator Access';

      if (r === 'Billing') { badgeClass = 'badge-billing'; summary = 'Invoices & Quotations Only'; }
      else if (r === 'Inventory') { badgeClass = 'badge-inventory'; summary = 'Stock & Inventory Only'; }
      else if (r === 'ViewOnly') { badgeClass = 'badge-view'; summary = 'Read-Only Access'; }

      const tbody = document.querySelector('#userTable tbody');
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${u}</td>
        <td><span class="badge-role ${badgeClass}">${r}</span></td>
        <td>${summary}</td>
        <td><button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteUser('${u}', this)">Delete</button></td>
      `;

      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      
      document.getElementById('statUsers').innerText = Object.keys(userDatabase).length;

      alert(`User account '${u}' created with '${r}' Role & Limitations!`);
    }

    function deleteUser(username, btn) {
      delete userDatabase[username];
      btn.closest('tr').remove();
      document.getElementById('statUsers').innerText = Object.keys(userDatabase).length;
    }
  </script>

</body>
</html>
